<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Family</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7e6;color:#25344b;
font-family:Arial,sans-serif;text-align:center}
main{max-width:900px;margin:auto;padding:24px 16px}
h1{font-size:38px;margin:12px}
p{font-size:20px;line-height:1.5}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.control{border:0;border-radius:18px;background:#365dcc;
color:white;padding:15px 22px;font-size:20px;margin:6px}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:24px 0}
.card{width:145px;min-height:180px;border:4px solid transparent;
border-radius:24px;background:white;box-shadow:0 5px 0 #eadfc8;
padding:16px 8px;color:#25344b}
.card:focus-visible{outline:4px solid #365dcc}
.face{display:block;font-size:70px;margin-bottom:12px}
.label{font-size:24px;font-weight:bold}
.hero{background:#fff0a8;border-color:#e8b520}
.correct{border-color:#21854a;background:#e7ffe8}
#message{font-size:28px;font-weight:bold;min-height:76px}
#progress{color:#69573f;min-height:30px}
button:disabled{cursor:default;opacity:.65}
@media(max-width:480px){
.card{width:42%;min-height:155px}
.face{font-size:58px}
h1{font-size:32px}
}
</style>
</head>
<body>
<main>
<h1>🏡 My Family</h1>
<p>⭐ Meet Sam. This is Sam's family.<br>
Speak as Sam: “This is my father.”</p>
<div class="controls">
<button class="control" id="learn">📖 Meet my family</button>
<button class="control" id="play">🎮 Let's play!</button>
<button class="control" id="repeat">🔊 Listen again</button>
</div>
<p id="progress"></p>
<div id="message" role="status" aria-live="polite"></div>
<div class="cards" id="cards"></div>
<button class="control" id="next" hidden>Next ➜</button>
<p>Listen, tap and say the sentence!</p>
</main>
<script>
const family=[
{id:"father",face:"👨",label:"father"},
{id:"mother",face:"👩",label:"mother"},
{id:"sister",face:"👧",label:"sister"},
{id:"brother",face:"👦",label:"brother"},
{id:"me",face:"🧒⭐",label:"me"}
];
const cards=document.getElementById("cards");
const message=document.getElementById("message");
const progress=document.getElementById("progress");
const next=document.getElementById("next");
let mode="learn",questions=[],round=0,answered=false,lastSpeech="";
function say(text){
 lastSpeech=text;
 if(!("speechSynthesis" in window))return;
 window.speechSynthesis.cancel();
 const voice=new SpeechSynthesisUtterance(text);
 voice.lang="en-GB";
 voice.rate=0.8;
 window.speechSynthesis.speak(voice);
}
function sentence(person){
 return person.id==="me"?"This is me.":"This is my "+person.id+".";
}
function shuffle(items){
 const copy=[...items];
 for(let i=copy.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [copy[i],copy[j]]=[copy[j],copy[i]];
 }
 return copy;
}
function draw(items){
 cards.replaceChildren();
 items.forEach(person=>{
  const button=document.createElement("button");
  button.className="card"+(person.id==="me"?" hero":"");
  button.setAttribute("aria-label",person.label);
  button.innerHTML='<span class="face" aria-hidden="true">'+
   person.face+'</span><span class="label">'+person.label+'</span>';
  button.onclick=()=>choose(person,button);
  cards.appendChild(button);
 });
}
function learn(){
 mode="learn";answered=false;next.hidden=true;
 progress.textContent="Meet my family";
 message.textContent="Tap a person.";
 draw(family);
 say("Meet my family. The child with the star is me.");
}
